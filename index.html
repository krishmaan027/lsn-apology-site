<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry </title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd6e0,#ffc2d1);
    overflow:hidden;
}

.card{
    background:#fff;
    padding:50px 40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
    animation:fade 1s ease;
}

h1{
    font-size:48px;
    color:#e63973;
    margin-bottom:15px;
}

h2{
    font-size:22px;
    color:#555;
    font-weight:normal;
    margin-bottom:30px;
}

button{
    padding:12px 28px;
    border:none;
    border-radius:30px;
    background:#e63973;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
}

#text{
    margin-top:25px;
    font-size:22px;
    color:#e63973;
    font-weight:bold;
}

.heart{
    position:absolute;
    color:#ff4d88;
    animation:float 5s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:1;
    }
    to{
        transform:translateY(-10vh);
        opacity:0;
    }
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="card">
    <h1>I'm Sorry </h1>
    <h2>I won't make that stupid joke again.</h2>

    <button onclick="forgive()">💗 Forgive Me</button>

    <div id="text"></div>
</div>

<script>
function forgive(){

    document.getElementById("text").innerHTML="Thank You ❤️";

    for(let i=0;i<30;i++){
        let heart=document.createElement("div");
        heart.className="heart";
        heart.innerHTML="❤️";
        heart.style.left=Math.random()*100+"vw";
        heart.style.fontSize=(15+Math.random()*25)+"px";
        heart.style.animationDuration=(3+Math.random()*3)+"s";
        document.body.appendChild(heart);

        setTimeout(()=>heart.remove(),6000);
    }
}
</script>

</body>
</html>
